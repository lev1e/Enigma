[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-anonymizer"
dynamic = ["version"]
description = "Offline reversible document anonymizer for Windows"
requires-python = ">=3.12"
dependencies = [
  "cryptography==50.0.2", "lxml==6.1.1", "openpyxl==3.1.5",
  "python-docx==1.2.0", "python-pptx==1.0.2", "PyMuPDF==1.26.7", "Pillow==12.3.0",
  "pymorphy3==2.0.6", "pymorphy3-dicts-ru==2.4.417150.4580142"
]

[tool.setuptools]
packages = ["anonymizer"]

[tool.setuptools.dynamic]
version = {attr = "anonymizer.__version__"}

[tool.ruff]
line-length = 140
target-version = "py312"
